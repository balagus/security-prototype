# Tempo (AGPL-3.0), single binary, filesystem storage.
# Adapted from balagus/telemetries config/tempo/tempo.yaml at commit 91f6f8d.
# Changes from the source: local backend instead of S3/MinIO, 72-hour retention (lab), no
# metrics-generator (it needs Mimir, which the lab does not run).
# Reachable only on the internal network telemetry-store (Alloy and Grafana).
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 72h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
