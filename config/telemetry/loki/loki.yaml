# Loki (AGPL-3.0), single binary, filesystem storage.
# Adapted from balagus/telemetries config/loki/loki.yaml at commit 91f6f8d.
# Changes from the source: filesystem instead of S3/MinIO, 7-day retention (lab; debug
# telemetry, not the audit trail), smaller caches for the 8 GB lab machine.
# auth_enabled: false is acceptable here only because Loki is reachable on the internal network
# telemetry-store alone (Alloy and Grafana); it has no published port.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

# Native OTLP ingestion (/otlp/v1/logs). Promote a few resource attributes to labels;
# everything else (trace_id, span_id, ...) stays as structured metadata.
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - deployment.environment

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 168h             # 7 days
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 2000
  allow_structured_metadata: true    # required for OTLP ingestion
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

analytics:
  reporting_enabled: false
