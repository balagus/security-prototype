# Audit log shipper (Fluent Bit 5.1.5, Apache-2.0). See compose.yaml, service fluent-bit, and
# docs/DECISIONS.md D9.
#
# Sources (all mounted READ-ONLY; no Docker socket, no network):
#   /src/pg-primary, /src/pg-replica        PostgreSQL jsonlog files (log_destination=jsonlog)
#   /src/maria-primary, /src/maria-replica  MariaDB server_audit files
#   /src/openbao                            OpenBao file audit device
#   /src/pg-sweeper, /src/maria-sweeper     sweeper stdout, tee'd to a file
#   /src/maria-replica/backstop             MariaDB startup purge and expiry backstop lines
#   /src/pg-replica/pg-deny                 PostgreSQL replica deny-list watcher lines
#   /src/lease-reconciler                   OpenBao lease reconciler stdout, tee'd to a file
#   /src/portal                             approval portal audit log (one JSON object per line)
# Store (read-write, mounted by this container only):
#   /store/audit.jsonl   every record, normalized to one JSON object per line
#   /store/alerts.jsonl  a copy of every record that matched an alert rule (field "alert")
# Normalization and the alert rules: audit.lua. The tag is "<kind>.<source>", e.g.
# pg.pg-replica; audit.lua takes the source server's name from it.

[SERVICE]
    Flush         1
    Daemon        off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/audit/parsers.conf
    HTTP_Server   off

# ---- PostgreSQL --------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               pg.pg-primary
    Path              /src/pg-primary/*.json
    Parser            json_lines
    DB                /state/pg-primary.db
    Read_from_Head    true
    Refresh_Interval  2
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   on
    Mem_Buf_Limit     8MB

[INPUT]
    Name              tail
    Tag               pg.pg-replica
    Path              /src/pg-replica/*.json
    Parser            json_lines
    DB                /state/pg-replica.db
    Read_from_Head    true
    Refresh_Interval  2
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   on
    Mem_Buf_Limit     8MB

# ---- MariaDB ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               maria.maria-primary
    Path              /src/maria-primary/server_audit.log
    Parser            maria_audit
    DB                /state/maria-primary.db
    Read_from_Head    true
    Refresh_Interval  2
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   on
    Mem_Buf_Limit     8MB

[INPUT]
    Name              tail
    Tag               maria.maria-replica
    Path              /src/maria-replica/server_audit.log
    Parser            maria_audit
    DB                /state/maria-replica.db
    Read_from_Head    true
    Refresh_Interval  2
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   on
    Mem_Buf_Limit     8MB

# ---- OpenBao ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Tag               bao.openbao
    Path              /src/openbao/audit.log
    Parser            json_lines
    DB                /state/openbao.db
    Read_from_Head    true
    Refresh_Interval  2
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   2M
    Skip_Long_Lines   on
    Mem_Buf_Limit     8MB

# ---- Sweepers (plain text lines "<time> engine=... action=... key=value ...") ----------
[INPUT]
    Name              tail
    Tag               sweeper.pg-sweeper
    Path              /src/pg-sweeper/pg-sweeper.log
    DB                /state/pg-sweeper.db
    Read_from_Head    true
    Refresh_Interval  2
    Mem_Buf_Limit     2MB

[INPUT]
    Name              tail
    Tag               sweeper.maria-sweeper
    Path              /src/maria-sweeper/maria-sweeper.log
    DB                /state/maria-sweeper.db
    Read_from_Head    true
    Refresh_Interval  2
    Mem_Buf_Limit     2MB

# ---- Revocation backstops (plain text lines "<time> engine=... action=... key=value ...") ----
# MariaDB replica: one file per startup purge and per expiry-backstop run that dropped users,
# written by the server itself (SELECT ... INTO OUTFILE, --secure-file-priv directory).
[INPUT]
    Name              tail
    Tag               backstop.maria-replica
    Path              /src/maria-replica/backstop/*.log
    DB                /state/maria-backstop.db
    Read_from_Head    true
    Refresh_Interval  2
    Mem_Buf_Limit     2MB

# PostgreSQL replica deny list (config/postgres/pg-deny-watcher.sh): one line per action, written
# by the watcher inside pg-replica to its log volume, subdirectory pg-deny/.
[INPUT]
    Name              tail
    Tag               backstop.pg-replica
    Path              /src/pg-replica/pg-deny/*.log
    DB                /state/pg-deny.db
    Read_from_Head    true
    Refresh_Interval  2
    Mem_Buf_Limit     2MB

# OpenBao lease reconciler (stdout tee'd to a file).
[INPUT]
    Name              tail
    Tag               reconciler.lease-reconciler
    Path              /src/lease-reconciler/lease-reconciler.log
    DB                /state/lease-reconciler.db
    Read_from_Head    true
    Refresh_Interval  2
    Mem_Buf_Limit     2MB

# ---- Approval portal (apps/portal, AuditLog.cs) -----------------------------------------
# One JSON object per line: request, approval, denial, membership added/removed, expiry,
# revocation, drift. Written by the portal (uid 1654) to the portal-log volume.
[INPUT]
    Name              tail
    Tag               portal.portal
    Path              /src/portal/portal-audit.log
    Parser            json_lines
    DB                /state/portal.db
    Read_from_Head    true
    Refresh_Interval  2
    Buffer_Chunk_Size 64k
    Buffer_Max_Size   1M
    Skip_Long_Lines   on
    Mem_Buf_Limit     2MB

# ---- Normalize every record and evaluate the alert rules ---------------------------------
[FILTER]
    Name        lua
    Match_Regex ^(pg|maria|bao|sweeper|backstop|reconciler|portal)\.
    script      /fluent-bit/etc/audit/audit.lua
    call        normalize

# A record that matched a rule has a non-empty "alert" field: emit a copy tagged "alerts"
# (the original continues to audit.jsonl).
[FILTER]
    Name                  rewrite_tag
    Match_Regex           ^(pg|maria|bao|sweeper|backstop|reconciler|portal)\.
    Rule                  $alert ^.+$ alerts true
    Emitter_Name          alerts_emitter
    Emitter_Mem_Buf_Limit 8MB

# ---- Store -------------------------------------------------------------------------------
[OUTPUT]
    Name        file
    Match_Regex ^(pg|maria|bao|sweeper|backstop|reconciler|portal)\.
    Path        /store
    File        audit.jsonl
    Format      plain

[OUTPUT]
    Name        file
    Match       alerts
    Path        /store
    File        alerts.jsonl
    Format      plain
