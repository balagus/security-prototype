# Maps the original request URI (with query string) to the URI without the /laravel prefix.
map $request_uri $laravel_request_uri {
    ~^/laravel(?<stripped>/.*)$  $stripped;
    default                      $request_uri;
}

server {
    listen 80;
    server_name _;

    # Docker embedded DNS: names are resolved at request time, so nginx starts
    # even when a backend container is not up yet.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # Phase 5: browser telemetry (Faro) -> Grafana Alloy, same origin, so Alloy publishes no
    # port. /faro/collect -> http://alloy:12347/collect. In phases 0 to 4 there is no alloy:
    # nginx still starts (resolved at request time) and the request fails with 502.
    location /faro/ {
        set $alloy_upstream alloy:12347;
        rewrite ^/faro/(.*)$ /$1 break;
        proxy_pass http://$alloy_upstream;
        proxy_http_version 1.1;
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # .NET API: /dotnet/x?y -> http://dotnet-api:8080/x?y
    location /dotnet/ {
        set $dotnet_upstream dotnet-api:8080;
        # With a variable in proxy_pass (and no URI part) the current (rewritten)
        # URI is sent as-is, and the query string is kept.
        rewrite ^/dotnet/(.*)$ /$1 break;
        proxy_pass http://$dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Laravel API via PHP-FPM: everything goes to the front controller.
    location /laravel/ {
        set $laravel_upstream laravel-api:9000;
        fastcgi_pass $laravel_upstream;

        fastcgi_param REQUEST_METHOD    $request_method;
        fastcgi_param CONTENT_TYPE      $content_type;
        fastcgi_param CONTENT_LENGTH    $content_length;
        fastcgi_param QUERY_STRING      $query_string;
        fastcgi_param REQUEST_URI       $laravel_request_uri;
        fastcgi_param SCRIPT_FILENAME   /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME       /index.php;
        fastcgi_param DOCUMENT_ROOT     /var/www/html/public;
        fastcgi_param SERVER_PROTOCOL   $server_protocol;
        fastcgi_param SERVER_NAME       $server_name;
        fastcgi_param SERVER_PORT       $server_port;
        fastcgi_param REMOTE_ADDR       $remote_addr;
        fastcgi_param HTTPS             "";
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    }

    # Angular SPA with fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}