# Phase 0: deliberately INSECURE baseline. Do not use anywhere but a local dev machine.
# Every deliberate weakness is marked with a comment starting "# PHASE0-INSECURE:".
name: security-prototype-phase0

services:
  pg-primary:
    image: postgres:17
    mem_limit: 512m
    environment:
      POSTGRES_DB: app1
      POSTGRES_USER: postgres
      # PHASE0-INSECURE: weak superuser password in plain text in the compose file.
      POSTGRES_PASSWORD: postgres123
    ports:
      # PHASE0-INSECURE: database port published to the host.
      - "5432:5432"
    volumes:
      # Named volume (not an NTFS bind mount): Postgres needs real Linux file permissions.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  maria-primary:
    image: mariadb:11.8
    mem_limit: 512m
    environment:
      MARIADB_DATABASE: app1
      # PHASE0-INSECURE: weak root password in plain text in the compose file.
      MARIADB_ROOT_PASSWORD: rootpass123
      # PHASE0-INSECURE: root may log in from any host (remote root allowed).
      MARIADB_ROOT_HOST: "%"
    ports:
      # PHASE0-INSECURE: database port published to the host.
      - "3306:3306"
    volumes:
      - maria-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  dotnet-api:
    build: ./apps/dotnet-api
    mem_limit: 384m
    environment:
      # PHASE0-INSECURE: the app connects as the postgres superuser with a plain-text password.
      ConnectionStrings__App1: "Host=pg-primary;Port=5432;Database=app1;Username=postgres;Password=postgres123"
      # PHASE0-INSECURE: the app migrates its own schema at startup, so it needs DDL rights.
      RUN_MIGRATIONS_ON_STARTUP: "true"
    # Listens on 8080 inside the network only (not published).
    # No healthcheck: the image has no curl or wget.
    depends_on:
      pg-primary:
        condition: service_healthy

  laravel-api:
    build: ./apps/laravel-api
    mem_limit: 256m
    environment:
      APP_ENV: local
      # PHASE0-INSECURE: debug mode on, so errors can leak stack traces and config.
      APP_DEBUG: "true"
      # PHASE0-INSECURE: throwaway app key committed in plain text.
      APP_KEY: "base64:16iTA8lPFsY7RrTNPms70j/7vfyPojfXSFgO3zw+BUQ="
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      # PHASE0-INSECURE: the app connects as database root with a plain-text password.
      DB_USERNAME: root
      DB_PASSWORD: rootpass123
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      # PHASE0-INSECURE: the app migrates its own schema at startup, so it needs DDL rights.
      RUN_MIGRATIONS_ON_STARTUP: "true"
    # PHP-FPM on 9000, not published.
    depends_on:
      maria-primary:
        condition: service_healthy

  web:
    build: ./apps/web
    mem_limit: 128m
    ports:
      # PHASE0-INSECURE: plain HTTP only, no TLS.
      - "8080:80"
    depends_on:
      dotnet-api:
        condition: service_started
      laravel-api:
        condition: service_started

# PHASE0-INSECURE: one flat default network; every service can reach every other service,
# including both databases.

volumes:
  pg-data:
  maria-data:
