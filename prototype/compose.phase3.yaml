# Phase 3: phase 2 plus read replicas and replica session sweepers (design sections 4.B, 4.C,
# 5.1, 5.4). Developers reach ONLY the replicas; the primaries are off the "access" network.
# Standalone file: everything from compose.phase2.yaml is repeated here with its own project
# name and volumes. Stop phase 2 before starting this (host port 8080, the same subnets, memory).
#
# Before first start:  powershell -ExecutionPolicy Bypass -File .\scripts\gen-secrets.ps1
# After "up -d":       powershell -ExecutionPolicy Bypass -File .\scripts\phase3-setup.ps1
# No password, connection string, token or key appears in this file.
#
# Fixed addresses (pg_hba.conf, MariaDB host masks and the tests depend on them):
#   bao-admin  10.81.4.0/24  openbao .10
#   access     10.81.5.0/24  pg-replica .11, maria-replica .12, pg-sweeper .21, maria-sweeper .22
#   pg-repl    10.81.7.0/24  pg-primary .10, pg-replica .11
#   maria-repl 10.81.8.0/24  maria-primary .10, maria-replica .11
name: security-prototype-phase3

services:
  # One-shot lab PKI: CA + server certificates (now also for both replicas) into named volumes.
  pki-init:
    image: postgres:17          # reused only for its openssl binary; no server is started
    entrypoint: ["sh", "/pki-init.sh"]
    user: "0:0"
    network_mode: none
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    configs:
      - source: pki_init
        target: /pki-init.sh
    volumes:
      - pki-ca-key:/pki-ca-key
      - pki-ca:/pki-ca
      - pki-pg:/pki-pg
      - pki-maria:/pki-maria
      - pki-bao:/pki-bao
      - pki-pg-replica:/pki-pg-replica
      - pki-maria-replica:/pki-maria-replica

  pg-primary:
    image: postgres:17
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/server.crt
      - -c
      - ssl_key_file=/pki/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      # Phase 3: streaming replication (wal_level=replica and max_wal_senders=10 are the
      # defaults). The replica uses the physical slot pg_replica, so WAL it still needs is kept
      # while it is stopped; the cap stops a dead replica from filling the primary's disk.
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_DB: app1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
      - pg_app1_migrator_password
      - pg_app1_runtime_password
      - pg_bao_admin_initial_password
      # Phase 3: replicator (first init, 20-replication.sh) and the sweeper account
      # (/opt/phase3/access-setup.sh, run by phase3-setup.ps1; replicates to the replica).
      - pg_replicator_password
      - pg_session_sweeper_password
    configs:
      - source: pg_hba_primary
        target: /etc/postgresql/pg_hba.conf
      - source: pg_init_roles
        target: /docker-entrypoint-initdb.d/10-app1-roles.sh
      - source: pg_init_replication
        target: /docker-entrypoint-initdb.d/20-replication.sh
      - source: pg_phase2_access_setup
        target: /opt/phase2/access-setup.sh
      - source: pg_phase3_access_setup
        target: /opt/phase3/access-setup.sh
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pki-pg:/pki:ro
    networks:
      app1-pg: {}
      # OpenBao connects here as bao_admin (never through "access").
      bao-admin: {}
      pg-repl:
        ipv4_address: 10.81.7.10
      # Phase 3: NOT on "access" (the PHASE2-FALLBACK attachment is gone).
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d app1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # Phase 3: hot standby, physical streaming replication from pg-primary over verified TLS.
  # First start: replica-entrypoint.sh clones the primary with pg_basebackup; later starts
  # skip that (marker file), so a restart resumes streaming from where it stopped.
  pg-replica:
    image: postgres:17
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["bash", "/opt/replica/replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/server.crt
      - -c
      - ssl_key_file=/pki/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - hot_standby=on
      # No password here: libpq reads it from the passfile, which the entrypoint builds from
      # the Docker secret at every start.
      - -c
      - primary_conninfo=host=pg-primary port=5432 user=replicator application_name=pg-replica sslmode=verify-full sslrootcert=/pki-ca/ca.crt passfile=/var/run/postgresql/replica/pgpass
      - -c
      - primary_slot_name=pg_replica
      # A replica query that blocks WAL replay is cancelled after 30 s of replay delay, so the
      # replica (and with it new credentials and revocations) never falls further behind than
      # that because of a developer query. Set explicitly; 30 s is also the default.
      - -c
      - max_standby_streaming_delay=30s
      # Off on purpose: with feedback on, a long developer query on the replica holds back
      # VACUUM on the PRIMARY (bloat, wraparound pressure), so a read-only developer could
      # degrade production. Off means such a query is cancelled instead (see above).
      - -c
      - hot_standby_feedback=off
    environment:
      PGDATA: /var/lib/postgresql/data
    secrets:
      - pg_replicator_password
    configs:
      - source: pg_replica_entrypoint
        target: /opt/replica/replica-entrypoint.sh
      - source: pg_hba_replica
        target: /etc/postgresql/pg_hba.conf
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
      - pki-pg-replica:/pki:ro
      # Verifies pg-primary's certificate (verify-full) for pg_basebackup and streaming.
      - pki-ca:/pki-ca:ro
    networks:
      pg-repl:
        ipv4_address: 10.81.7.11
      access:
        ipv4_address: 10.81.5.11
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres psql -XAtq -d postgres -c \"SELECT status FROM pg_stat_wal_receiver\" | grep -qx streaming"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      pki-init:
        condition: service_completed_successfully
      pg-primary:
        condition: service_healthy

  maria-primary:
    image: mariadb:11.8
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    command:
      - mariadbd
      - --ssl-cert=/pki/server.crt
      - --ssl-key=/pki/server.key
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3
      # Phase 3: binary log with GTIDs for the replica.
      - --server-id=1
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --binlog-expire-logs-seconds=604800
    environment:
      MARIADB_DATABASE: app1
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/maria_root_password
      MARIADB_ROOT_HOST: localhost
      APP1_MARIA_HOSTMASK: 10.81.3.0/255.255.255.0
      BAO_ADMIN_HOST: 10.81.4.10
      # Phase 3: replicator exists only for the replica's fixed maria-repl address (first init),
      # session_sweeper only for the sweeper's fixed access address (phase3 access setup).
      REPLICA_HOST: 10.81.8.11
      SWEEPER_HOST: 10.81.5.22
    secrets:
      - maria_root_password
      - maria_app1_migrator_password
      - maria_app1_runtime_password
      - maria_bao_admin_initial_password
      - maria_replicator_password
      - maria_session_sweeper_password
    configs:
      - source: maria_init_users
        target: /docker-entrypoint-initdb.d/10-app1-users.sh
      - source: maria_init_replication
        target: /docker-entrypoint-initdb.d/20-replication.sh
      - source: maria_phase2_access_setup
        target: /opt/phase2/access-setup.sh
      - source: maria_phase3_access_setup
        target: /opt/phase3/access-setup.sh
    volumes:
      - maria-data:/var/lib/mysql
      - pki-maria:/pki:ro
    networks:
      app1-maria: {}
      bao-admin: {}
      maria-repl:
        ipv4_address: 10.81.8.10
      # Phase 3: NOT on "access".
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # Phase 3: GTID replica of maria-primary, read_only. First start (empty volume): the init
  # script 20-replica-seed.sh takes a consistent dump of the primary INCLUDING the mysql system
  # database (so existing accounts exist), loads it and starts replication at the dump's GTID.
  # replica-entrypoint.sh wipes a half-seeded data directory before the image entrypoint runs.
  maria-replica:
    image: mariadb:11.8
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["bash", "/opt/replica/replica-entrypoint.sh"]
    command:
      - mariadbd
      - --ssl-cert=/pki/server.crt
      - --ssl-key=/pki/server.key
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3
      - --server-id=2
      - --read-only=ON
      - --gtid-strict-mode=ON
      - --relay-log=maria-replica-relay
      # Smaller than the default 128M: the replica gets 384m.
      - --innodb-buffer-pool-size=64M
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/maria_root_password
      MARIADB_ROOT_HOST: localhost
      MARIADB_PRIMARY_HOST: maria-primary
    secrets:
      - maria_root_password
      - maria_replicator_password
    configs:
      - source: maria_replica_entrypoint
        target: /opt/replica/replica-entrypoint.sh
      - source: maria_replica_seed
        target: /docker-entrypoint-initdb.d/20-replica-seed.sh
    volumes:
      - maria-replica-data:/var/lib/mysql
      - pki-maria-replica:/pki:ro
      # Verifies maria-primary's certificate (seed dump and replication connection).
      - pki-ca:/pki-ca:ro
    networks:
      maria-repl:
        ipv4_address: 10.81.8.11
      access:
        ipv4_address: 10.81.5.12
    healthcheck:
      # The replica's own healthcheck account gets REPLICA MONITOR in 20-replica-seed.sh.
      # The replication_* options are settings for the --replication test that follows them.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized", "--replication_io", "--replication_sql", "--replication"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    depends_on:
      pki-init:
        condition: service_completed_successfully
      maria-primary:
        condition: service_healthy

  # Phase 3: replica session sweepers (design 5.4). Small loops that reuse the database images
  # for their client tools; each logs one line per session it ends (docker compose logs).
  # SWEEP_INTERVAL_SECONDS: 10 in the lab; the proposal says 60 for production.
  pg-sweeper:
    image: postgres:17
    entrypoint: ["bash", "/opt/sweeper/pg-sweeper.sh"]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    environment:
      SWEEP_INTERVAL_SECONDS: "10"
      SWEEP_TARGET_HOST: pg-replica
    secrets:
      - pg_session_sweeper_password
    configs:
      - source: pg_sweeper
        target: /opt/sweeper/pg-sweeper.sh
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      access:
        ipv4_address: 10.81.5.21
    depends_on:
      pg-replica:
        condition: service_started

  maria-sweeper:
    image: mariadb:11.8
    entrypoint: ["bash", "/opt/sweeper/maria-sweeper.sh"]
    user: "999:999"
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=1777
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    environment:
      SWEEP_INTERVAL_SECONDS: "10"
      SWEEP_TARGET_HOST: maria-replica
    secrets:
      - maria_session_sweeper_password
    configs:
      - source: maria_sweeper
        target: /opt/sweeper/maria-sweeper.sh
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      access:
        ipv4_address: 10.81.5.22
    depends_on:
      maria-replica:
        condition: service_started

  dotnet-migrate:
    build: ./apps/dotnet-api
    image: security-prototype-phase3-dotnet-api
    command: ["migrate"]
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: dotnet_migrator_connstr
        target: ConnectionStrings__Migrator
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - app1-pg
    depends_on:
      pg-primary:
        condition: service_healthy

  dotnet-api:
    build: ./apps/dotnet-api
    image: security-prototype-phase3-dotnet-api
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: dotnet_app1_connstr
        target: ConnectionStrings__App1
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - web
      - app1-pg
    depends_on:
      dotnet-migrate:
        condition: service_completed_successfully

  laravel-migrate:
    build: ./apps/laravel-api
    image: security-prototype-phase3-laravel-api
    command: ["migrate"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      MIGRATOR_DB_USERNAME: app1_migrator
      MIGRATOR_DB_PASSWORD_FILE: /run/secrets/maria_app1_migrator_password
      MYSQL_ATTR_SSL_CA: /pki-ca/ca.crt
    secrets:
      - maria_app1_migrator_password
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - app1-maria
    depends_on:
      maria-primary:
        condition: service_healthy

  laravel-api:
    build: ./apps/laravel-api
    image: security-prototype-phase3-laravel-api
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY_FILE: /run/secrets/laravel_app_key
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      DB_USERNAME: app1_runtime
      DB_PASSWORD_FILE: /run/secrets/maria_app1_runtime_password
      MYSQL_ATTR_SSL_CA: /pki-ca/ca.crt
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
    secrets:
      - laravel_app_key
      - maria_app1_runtime_password
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - web
      - app1-maria
    depends_on:
      laravel-migrate:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    image: security-prototype-phase3-web
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:80"
    networks:
      - edge
      - web
    depends_on:
      dotnet-api:
        condition: service_started
      laravel-api:
        condition: service_started

  # OpenBao: unchanged from phase 2, plus the access network (developers log in here).
  # Starts SEALED after every (re)start: run
  #   scripts\phase2-unseal.ps1 -ComposeFile .\compose.phase3.yaml -Project security-prototype-phase3 -BaoSecretPrefix openbao_phase3
  openbao:
    image: openbao/openbao:2.7.2      # MPL-2.0
    command: ["bao", "server", "-config=/openbao/config/bao.hcl"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /pki-ca/ca.crt
      SKIP_CHOWN: "true"
    configs:
      - source: bao_config
        target: /openbao/config/bao.hcl
      - source: bao_policy_app1_debug
        target: /openbao/setup/app1-debug.hcl
    volumes:
      - bao-data:/openbao/file
      - bao-audit:/openbao/logs
      - pki-bao:/pki-bao:ro
      - pki-ca:/pki-ca:ro
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      bao-admin:
        # Fixed: pg_hba.conf and the MariaDB bao_admin host are tied to this address.
        ipv4_address: 10.81.4.10
      lab: {}
      access: {}
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # Keycloak: unchanged from phase 2, plus the access network. LAB-ONLY dev mode, see phase 2.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2   # Apache-2.0
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(< /run/secrets/keycloak_admin_password)"
        export KC_OPENBAO_CLIENT_SECRET="$$(< /run/secrets/keycloak_openbao_client_secret)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
    secrets:
      - keycloak_admin_password
      - keycloak_openbao_client_secret
    configs:
      - source: keycloak_realm
        target: /opt/keycloak/data/import/lab-realm.json
    ports:
      - "127.0.0.1:8180:8180"
    networks:
      lab:
        aliases:
          - keycloak.localhost
      access:
        aliases:
          - keycloak.localhost

networks:
  edge:
    ipam:
      config:
        - subnet: 10.81.0.0/24
  web:
    internal: true
    ipam:
      config:
        - subnet: 10.81.1.0/24
  app1-pg:
    internal: true
    ipam:
      config:
        - subnet: 10.81.2.0/24
  app1-maria:
    internal: true
    ipam:
      config:
        - subnet: 10.81.3.0/24
  # OpenBao (fixed 10.81.4.10) and both primaries: OpenBao's admin connections.
  bao-admin:
    internal: true
    ipam:
      config:
        - subnet: 10.81.4.0/24
  # Where developers connect from. Of the databases, only the replicas are on it.
  access:
    internal: true
    ipam:
      config:
        - subnet: 10.81.5.0/24
  lab:
    ipam:
      config:
        - subnet: 10.81.6.0/24
  # Phase 3: replication traffic only.
  pg-repl:
    internal: true
    ipam:
      config:
        - subnet: 10.81.7.0/24
  maria-repl:
    internal: true
    ipam:
      config:
        - subnet: 10.81.8.0/24

volumes:
  pg-data:
  maria-data:
  pg-replica-data:
  maria-replica-data:
  pki-ca-key:
  pki-ca:
  pki-pg:
  pki-maria:
  pki-bao:
  pki-pg-replica:
  pki-maria-replica:
  bao-data:
  bao-audit:

configs:
  pki_init:
    file: ./config/pki/pki-init.sh
  pg_init_roles:
    file: ./config/postgres/10-app1-roles.sh
  pg_init_replication:
    file: ./config/postgres/20-replication.sh
  maria_init_users:
    file: ./config/mariadb/10-app1-users.sh
  maria_init_replication:
    file: ./config/mariadb/20-replication.sh
  pg_phase2_access_setup:
    file: ./config/postgres/phase2-access-setup.sh
  maria_phase2_access_setup:
    file: ./config/mariadb/phase2-access-setup.sh
  pg_phase3_access_setup:
    file: ./config/postgres/phase3-access-setup.sh
  maria_phase3_access_setup:
    file: ./config/mariadb/phase3-access-setup.sh
  pg_replica_entrypoint:
    file: ./config/postgres/replica-entrypoint.sh
  maria_replica_entrypoint:
    file: ./config/mariadb/replica-entrypoint.sh
  maria_replica_seed:
    file: ./config/mariadb/20-replica-seed.sh
  pg_sweeper:
    file: ./config/sweeper/pg-sweeper.sh
  maria_sweeper:
    file: ./config/sweeper/maria-sweeper.sh
  bao_config:
    file: ./config/openbao/bao.hcl
  bao_policy_app1_debug:
    file: ./config/openbao/app1-debug.hcl
  keycloak_realm:
    file: ./config/keycloak/lab-realm.json
  # Primary. First match wins.
  # - bao_admin is a member of debug_ro (ADMIN OPTION only, INHERIT FALSE, SET FALSE), and a
  #   "+debug_ro" line still matches it, so its own line MUST come before the reject.
  # - No PHASE2-FALLBACK line: temp users (members of debug_ro) are rejected from everywhere.
  # - "all" in the DATABASE column does not match replication connections, hence the explicit
  #   replication lines.
  pg_hba_primary:
    content: |
      # TYPE  DATABASE     USER           ADDRESS        METHOD
      local   all          postgres                      peer
      hostssl app1         bao_admin      10.81.4.10/32  scram-sha-256
      host    all          +debug_ro      all            reject
      hostssl app1         app1_runtime   10.81.2.0/24   scram-sha-256
      hostssl app1         app1_migrator  10.81.2.0/24   scram-sha-256
      hostssl replication  replicator     10.81.7.11/32  scram-sha-256
      host    replication  all            all            reject
      host    all          all            all            reject
  # Replica. bao_admin replicates from the primary and is a member of debug_ro, so it would
  # match the +debug_ro line: reject it first. The sweeper only from its fixed address.
  pg_hba_replica:
    content: |
      # TYPE  DATABASE     USER             ADDRESS        METHOD
      local   all          postgres                        peer
