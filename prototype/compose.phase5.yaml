  # Phase 4 variants and additions for MariaDB (config/mariadb/phase4/).
  maria_phase4_init_users:
    file: ./config/mariadb/phase4/10-app1-users.sh
  maria_phase4_init_replication:
    file: ./config/mariadb/phase4/20-replication.sh
  maria_phase4_phase2_access_setup:
    file: ./config/mariadb/phase4/phase2-access-setup.sh
  maria_phase4_phase3_access_setup:
    file: ./config/mariadb/phase4/phase3-access-setup.sh
  maria_phase4_replica_seed:
    file: ./config/mariadb/phase4/20-replica-seed.sh
  maria_phase4_replica_bao_account:
    file: ./config/mariadb/phase4/replica-bao-account.sh
  maria_phase4_replica_entrypoint:
    file: ./config/mariadb/phase4/replica-entrypoint.sh
  maria_phase4_replica_init:
    file: ./config/mariadb/phase4/replica-init.sql.tmpl
  lease_reconciler:
    file: ./config/reconciler/lease-reconciler.sh
  bao_policy_lease_reconciler:
    file: ./config/openbao/lease-reconciler.hcl
  pg_sweeper:
    file: ./config/sweeper/pg-sweeper.sh
  maria_sweeper:
    file: ./config/sweeper/maria-sweeper.sh
  bao_config:
    file: ./config/openbao/bao.phase4.hcl
  bao_policy_app1_debug:
    file: ./config/openbao/app1-debug.hcl
  keycloak_realm:
    file: ./config/keycloak/phase5/lab-realm.json
  fluent_bit_conf:
    file: ./config/fluent-bit/fluent-bit.conf
  fluent_bit_parsers:
    file: ./config/fluent-bit/parsers.conf
  fluent_bit_lua:
    file: ./config/fluent-bit/audit.lua
  # Phase 5: telemetry configs (config/telemetry/, adapted from balagus/telemetries).
  alloy_config:
    file: ./config/telemetry/alloy/config.alloy
  loki_config:
    file: ./config/telemetry/loki/loki.yaml
  tempo_config:
    file: ./config/telemetry/tempo/tempo.yaml
  grafana_datasources:
    file: ./config/telemetry/grafana/datasources.yaml
  # Primary. First match wins.
  # - bao_admin is a member of debug_ro (ADMIN OPTION only, INHERIT FALSE, SET FALSE), and a
  #   "+debug_ro" line still matches it, so its own line MUST come before the reject.
  # - No PHASE2-FALLBACK line: temp users (members of debug_ro) are rejected from everywhere.
  # - "all" in the DATABASE column does not match replication connections, hence the explicit
  #   replication lines.
  pg_hba_primary:
    content: |
      # TYPE  DATABASE     USER           ADDRESS        METHOD
      local   all          postgres                      peer
      hostssl app1         bao_admin      10.81.4.10/32  scram-sha-256
      host    all          +debug_ro      all            reject
      hostssl app1         app1_runtime   10.81.2.0/24   scram-sha-256
      hostssl app1         app1_migrator  10.81.2.0/24   scram-sha-256
      hostssl replication  replicator     10.81.7.11/32  scram-sha-256
      host    replication  all            all            reject
      host    all          all            all            reject
  # Replica. bao_admin replicates from the primary and is a member of debug_ro, so it would
  # match the +debug_ro line: reject it first. The sweeper only from its fixed address.
  # Phase 4: line 2 rejects every role named in the deny list that pg-deny-watcher.sh builds from
  # the reconciler's descriptors (revoked temp roles while the primary is down). It comes before
  # every allow line. The file always holds at least the sentinel /^$ (matches no role); its
  # other tokens are /^v-...$ patterns only. Columns: TYPE DATABASE USER ADDRESS METHOD (no
  # header line, so the line numbers of the other rules are those of phase 3).
  pg_hba_replica:
    content: |
      local   all          postgres                        peer
      host    all          @/var/lib/postgresql/pg-deny/denied_roles  all  reject
      host    all          bao_admin        all            reject
      hostssl app1         +debug_ro        10.81.5.0/24   scram-sha-256
      hostssl app1         session_sweeper  10.81.5.21/32  scram-sha-256
      host    replication  all              all            reject
      host    all          all              all            reject

