# Phase 4: parsers for config/fluent-bit/fluent-bit.conf.

# PostgreSQL jsonlog and the OpenBao file audit device: one JSON object per line. The record's
# own timestamp field is kept; audit.lua turns it into the normalized "timestamp".
[PARSER]
    Name   json_lines
    Format json

# MariaDB server_audit (output type file), one CSV-like line per event:
#   timestamp,serverhost,username,host,connectionid,queryid,operation,database,object,retcode
# The object of a QUERY event is the statement in single quotes and may itself contain commas,
# so it is matched greedily up to the last comma (retcode is always last and numeric).
[PARSER]
    Name   maria_audit
    Format regex
    Regex  ^(?<ts>\d{8} \d{2}:\d{2}:\d{2}),(?<serverhost>[^,]*),(?<username>[^,]*),(?<host>[^,]*),(?<connid>\d+),(?<queryid>\d+),(?<operation>[A-Z_]+),(?<database>[^,]*),(?<object>.*),(?<retcode>-?\d*)$
