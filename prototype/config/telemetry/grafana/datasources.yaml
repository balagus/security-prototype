# Phase 5: Grafana datasources (Loki + Tempo) with trace <-> log correlation.
# Adapted from balagus/telemetries config/grafana/provisioning/datasources/datasources.yaml at
# commit 91f6f8d. Changes from the source: no Mimir datasource and no trace-to-metrics /
# service map (no metrics backend in the lab); Tempo is the default datasource.
apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # Jump from a log line to its trace (structured metadata from OTLP).
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
