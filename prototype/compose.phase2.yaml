# Phase 2: phase 1 plus developer just-in-time access (workstream C, primaries only):
# OpenBao (database secrets engine) + Keycloak (OIDC), design sections 4.C, 4.E and 5.
# Standalone file: everything from compose.phase1.yaml is repeated here with its own project
# name and volumes. Stop phase 1 before starting this (host port 8080 and memory).
#
# Before first start:  powershell -ExecutionPolicy Bypass -File .\scripts\gen-secrets.ps1
# After "up -d":       powershell -ExecutionPolicy Bypass -File .\scripts\phase2-setup.ps1
# No password, connection string, token or key appears in this file.
name: security-prototype-phase2

services:
  # One-shot lab PKI: CA + server certificates (now also for OpenBao) into named volumes.
  pki-init:
    image: postgres:17          # reused only for its openssl binary; no server is started
    entrypoint: ["sh", "/pki-init.sh"]
    user: "0:0"
    network_mode: none
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    configs:
      - source: pki_init
        target: /pki-init.sh
    volumes:
      - pki-ca-key:/pki-ca-key
      - pki-ca:/pki-ca
      - pki-pg:/pki-pg
      - pki-maria:/pki-maria
      - pki-bao:/pki-bao

  pg-primary:
    image: postgres:17
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/server.crt
      - -c
      - ssl_key_file=/pki/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: app1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
      - pg_app1_migrator_password
      - pg_app1_runtime_password
      # Phase 2: read only by /opt/phase2/access-setup.sh (run by phase2-setup.ps1).
      - pg_bao_admin_initial_password
    configs:
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
      - source: pg_init_roles
        target: /docker-entrypoint-initdb.d/10-app1-roles.sh
      - source: pg_phase2_access_setup
        target: /opt/phase2/access-setup.sh
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pki-pg:/pki:ro
    networks:
      app1-pg: {}
      # OpenBao connects here as bao_admin.
      bao-admin: {}
      # PHASE2-FALLBACK: developers connect to the primary because there are no replicas yet.
      # Phase 3 moves this attachment to the replicas.
      access: {}
    healthcheck:
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d app1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      pki-init:
        condition: service_completed_successfully

  maria-primary:
    image: mariadb:11.8
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    command:
      - mariadbd
      - --ssl-cert=/pki/server.crt
      - --ssl-key=/pki/server.key
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3
    environment:
      MARIADB_DATABASE: app1
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/maria_root_password
      MARIADB_ROOT_HOST: localhost
      APP1_MARIA_HOSTMASK: 10.81.3.0/255.255.255.0
      # Phase 2: bao_admin exists only for OpenBao's fixed address (used by access-setup.sh).
      BAO_ADMIN_HOST: 10.81.4.10
    secrets:
      - maria_root_password
      - maria_app1_migrator_password
      - maria_app1_runtime_password
      - maria_bao_admin_initial_password
    configs:
      - source: maria_init_users
        target: /docker-entrypoint-initdb.d/10-app1-users.sh
      - source: maria_phase2_access_setup
        target: /opt/phase2/access-setup.sh
    volumes:
      - maria-data:/var/lib/mysql
      - pki-maria:/pki:ro
    networks:
      app1-maria: {}
      bao-admin: {}
      # PHASE2-FALLBACK: see pg-primary.
      access: {}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      pki-init:
        condition: service_completed_successfully

  dotnet-migrate:
    build: ./apps/dotnet-api
    image: security-prototype-phase2-dotnet-api
    command: ["migrate"]
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: dotnet_migrator_connstr
        target: ConnectionStrings__Migrator
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - app1-pg
    depends_on:
      pg-primary:
        condition: service_healthy

  dotnet-api:
    build: ./apps/dotnet-api
    image: security-prototype-phase2-dotnet-api
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: dotnet_app1_connstr
        target: ConnectionStrings__App1
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - web
      - app1-pg
    depends_on:
      dotnet-migrate:
        condition: service_completed_successfully

  laravel-migrate:
    build: ./apps/laravel-api
    image: security-prototype-phase2-laravel-api
    command: ["migrate"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      MIGRATOR_DB_USERNAME: app1_migrator
      MIGRATOR_DB_PASSWORD_FILE: /run/secrets/maria_app1_migrator_password
      MYSQL_ATTR_SSL_CA: /pki-ca/ca.crt
    secrets:
      - maria_app1_migrator_password
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - app1-maria
    depends_on:
      maria-primary:
        condition: service_healthy

  laravel-api:
    build: ./apps/laravel-api
    image: security-prototype-phase2-laravel-api
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY_FILE: /run/secrets/laravel_app_key
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      DB_USERNAME: app1_runtime
      DB_PASSWORD_FILE: /run/secrets/maria_app1_runtime_password
      MYSQL_ATTR_SSL_CA: /pki-ca/ca.crt
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
    secrets:
      - laravel_app_key
      - maria_app1_runtime_password
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - web
      - app1-maria
    depends_on:
      laravel-migrate:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    image: security-prototype-phase2-web
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    ports:
      - "8080:80"
    networks:
      - edge
      - web
    depends_on:
      dotnet-api:
        condition: service_started
      laravel-api:
        condition: service_started

  # ------------------------------------------------------------------------------------------
  # Phase 2: OpenBao. Real server config (config/openbao/bao.hcl): Raft storage on bao-data,
  # TLS from the lab CA, file audit device on bao-audit. Starts SEALED after every (re)start:
  # run scripts\phase2-unseal.ps1 (or phase2-setup.ps1).
  openbao:
    image: openbao/openbao:2.7.2      # MPL-2.0
    command: ["bao", "server", "-config=/openbao/config/bao.hcl"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      # For the bao CLI inside this container (phase2-setup.ps1 and the tests use docker exec).
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /pki-ca/ca.crt
      # The image runs as user openbao already; volumes inherit openbao ownership from the image.
      SKIP_CHOWN: "true"
    configs:
      - source: bao_config
        target: /openbao/config/bao.hcl
      - source: bao_policy_app1_debug
        target: /openbao/setup/app1-debug.hcl
    volumes:
      - bao-data:/openbao/file
      - bao-audit:/openbao/logs
      - pki-bao:/pki-bao:ro
      # Lab CA: verifies the database server certificates (connection TLS) and the own listener.
      - pki-ca:/pki-ca:ro
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      bao-admin:
        # Fixed: pg_hba.conf and the MariaDB bao_admin host are tied to this address.
        ipv4_address: 10.81.4.10
      lab: {}
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # Keycloak in dev mode. LAB-ONLY: plain HTTP, dev-file database, imported test realm with test
  # users whose test passwords live in config/keycloak/lab-realm.json.
  # The issuer is http://keycloak.localhost:8180/realms/lab from everywhere: browsers resolve
  # *.localhost to 127.0.0.1 (published port 8180), and containers on the lab network resolve
  # the network alias keycloak.localhost to this container, which also listens on 8180.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2   # Apache-2.0
    mem_limit: 768m
    security_opt: ["no-new-privileges:true"]
    # Secrets are read from /run/secrets into the process environment at start, so they are not
    # in the container configuration (docker inspect). The realm import replaces
    # ${KC_OPENBAO_CLIENT_SECRET} in lab-realm.json with the client secret.
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(< /run/secrets/keycloak_admin_password)"
        export KC_OPENBAO_CLIENT_SECRET="$$(< /run/secrets/keycloak_openbao_client_secret)"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://keycloak.localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Java heap cap; the container limit (768m) leaves room for metaspace and threads.
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
    secrets:
      - keycloak_admin_password
      - keycloak_openbao_client_secret
    configs:
      - source: keycloak_realm
        target: /opt/keycloak/data/import/lab-realm.json
    ports:
      - "127.0.0.1:8180:8180"
    networks:
      lab:
        aliases:
          - keycloak.localhost

networks:
  edge:
    ipam:
      config:
        - subnet: 10.81.0.0/24
  web:
    internal: true
    ipam:
      config:
        - subnet: 10.81.1.0/24
  app1-pg:
    internal: true
    ipam:
      config:
        - subnet: 10.81.2.0/24
  app1-maria:
    internal: true
    ipam:
      config:
        - subnet: 10.81.3.0/24
  # Phase 2. OpenBao (fixed 10.81.4.10) and both primaries: OpenBao's admin connections.
  bao-admin:
    internal: true
    ipam:
      config:
        - subnet: 10.81.4.0/24
  # Phase 2. Where developers connect from (the tests attach throwaway clients here).
  # PHASE2-FALLBACK: the primaries are attached because there are no replicas yet.
  access:
    internal: true
    ipam:
      config:
        - subnet: 10.81.5.0/24
  # Phase 2. Not internal: OpenBao and Keycloak, ports published on 127.0.0.1 only.
  # OpenBao reaches Keycloak here. No database is attached.
  lab:
    ipam:
      config:
        - subnet: 10.81.6.0/24

volumes:
  pg-data:
  maria-data:
  pki-ca-key:
  pki-ca:
  pki-pg:
  pki-maria:
  pki-bao:
  bao-data:
  bao-audit:

configs:
  pki_init:
    file: ./config/pki/pki-init.sh
  pg_init_roles:
    file: ./config/postgres/10-app1-roles.sh
  maria_init_users:
    file: ./config/mariadb/10-app1-users.sh
  pg_phase2_access_setup:
    file: ./config/postgres/phase2-access-setup.sh
  maria_phase2_access_setup:
    file: ./config/mariadb/phase2-access-setup.sh
  bao_config:
    file: ./config/openbao/bao.hcl
  bao_policy_app1_debug:
    file: ./config/openbao/app1-debug.hcl
  keycloak_realm:
    file: ./config/keycloak/lab-realm.json
  # First match wins. bao_admin is a member of debug_ro (ADMIN OPTION), so its line comes
  # before the +debug_ro lines. Subnets: bao-admin 10.81.4.0/24 (OpenBao fixed at .10),
  # access 10.81.5.0/24, app1-pg 10.81.2.0/24.
  pg_hba:
    content: |
      # TYPE  DATABASE  USER           ADDRESS        METHOD
      local   all       postgres                      peer
      hostssl app1      bao_admin      10.81.4.10/32  scram-sha-256
      # PHASE2-FALLBACK: temp users (members of debug_ro) on the primary, from the access
      # network only, TLS only. Phase 3 moves this line to the replicas and rejects here.
      hostssl app1      +debug_ro      10.81.5.0/24   scram-sha-256
      host    all       +debug_ro      all            reject
      hostssl app1      app1_runtime   10.81.2.0/24   scram-sha-256
      hostssl app1      app1_migrator  10.81.2.0/24   scram-sha-256
      host    all       all            all            reject

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  pg_app1_migrator_password:
    file: ./secrets/pg_app1_migrator_password
  pg_app1_runtime_password:
    file: ./secrets/pg_app1_runtime_password
  maria_root_password:
    file: ./secrets/maria_root_password
  maria_app1_migrator_password:
    file: ./secrets/maria_app1_migrator_password
  maria_app1_runtime_password:
    file: ./secrets/maria_app1_runtime_password
  laravel_app_key:
    file: ./secrets/laravel_app_key
  dotnet_app1_connstr:
    file: ./secrets/dotnet_app1_connstr
  dotnet_migrator_connstr:
    file: ./secrets/dotnet_migrator_connstr
  pg_bao_admin_initial_password:
    file: ./secrets/pg_bao_admin_initial_password
  maria_bao_admin_initial_password:
    file: ./secrets/maria_bao_admin_initial_password
  keycloak_admin_password:
    file: ./secrets/keycloak_admin_password
  keycloak_openbao_client_secret:
    file: ./secrets/keycloak_openbao_client_secret
