# Phase 1: hardened version of the phase 0 stack (sections 4.A and 4.B of prod-db-access-hardening.md).
# Before first start: powershell -ExecutionPolicy Bypass -File .\scripts\gen-secrets.ps1
# No password, connection string or APP_KEY appears in this file: they are Docker secrets
# read from .\secrets\ (generated, git-ignored) and mounted under /run/secrets.
name: security-prototype-phase1

services:
  # One-shot lab PKI: CA + server certificates into named volumes with uid 999 / mode 0600 keys.
  # The CA private key lives in pki-ca-key, which only this service mounts.
  pki-init:
    image: postgres:17          # reused only for its openssl binary; no server is started
    entrypoint: ["sh", "/pki-init.sh"]
    user: "0:0"
    network_mode: none
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]
    configs:
      - source: pki_init
        target: /pki-init.sh
    volumes:
      - pki-ca-key:/pki-ca-key
      - pki-ca:/pki-ca
      - pki-pg:/pki-pg
      - pki-maria:/pki-maria

  pg-primary:
    image: postgres:17
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    # The image's init phase starts a temporary server with these same arguments,
    # so the init script below runs with our pg_hba.conf (local socket, peer auth).
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/pki/server.crt
      - -c
      - ssl_key_file=/pki/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_DB: app1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
      - pg_app1_migrator_password
      - pg_app1_runtime_password
    configs:
      - source: pg_hba
        target: /etc/postgresql/pg_hba.conf
      - source: pg_init_roles
        target: /docker-entrypoint-initdb.d/10-app1-roles.sh
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pki-pg:/pki:ro
    networks:
      - app1-pg
    healthcheck:
      # Run as OS user postgres: pg_hba allows the socket only with peer auth, and a root
      # probe would log "Peer authentication failed" every 5 s.
      test: ["CMD-SHELL", "gosu postgres pg_isready -U postgres -d app1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      pki-init:
        condition: service_completed_successfully

  maria-primary:
    image: mariadb:11.8
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    command:
      - mariadbd
      - --ssl-cert=/pki/server.crt
      - --ssl-key=/pki/server.key
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3
    environment:
      MARIADB_DATABASE: app1
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/maria_root_password
      # root exists only as root@localhost (socket). No remote root.
      MARIADB_ROOT_HOST: localhost
      # Host mask for the app accounts: the app1-maria subnet in netmask form (never '%').
      APP1_MARIA_HOSTMASK: 10.81.3.0/255.255.255.0
    secrets:
      - maria_root_password
      - maria_app1_migrator_password
      - maria_app1_runtime_password
    configs:
      - source: maria_init_users
        target: /docker-entrypoint-initdb.d/10-app1-users.sh
    volumes:
      - maria-data:/var/lib/mysql
      - pki-maria:/pki:ro
    networks:
      - app1-maria
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      pki-init:
        condition: service_completed_successfully

  # One-off migration as app1_migrator. Same image as dotnet-api.
  dotnet-migrate:
    build: ./apps/dotnet-api
    image: security-prototype-phase1-dotnet-api
    command: ["migrate"]
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    secrets:
      - source: dotnet_migrator_connstr
        target: ConnectionStrings__Migrator
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - app1-pg
    depends_on:
      pg-primary:
        condition: service_healthy

  dotnet-api:
    build: ./apps/dotnet-api
    image: security-prototype-phase1-dotnet-api
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]
    # Runtime credential only (app1_runtime). No RUN_MIGRATIONS_ON_STARTUP.
    secrets:
      - source: dotnet_app1_connstr
        target: ConnectionStrings__App1
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - web
      - app1-pg
    depends_on:
      dotnet-migrate:
        condition: service_completed_successfully

  # One-off migration as app1_migrator. Same image as laravel-api.
  laravel-migrate:
    build: ./apps/laravel-api
    image: security-prototype-phase1-laravel-api
    command: ["migrate"]
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      MIGRATOR_DB_USERNAME: app1_migrator
      MIGRATOR_DB_PASSWORD_FILE: /run/secrets/maria_app1_migrator_password
      MYSQL_ATTR_SSL_CA: /pki-ca/ca.crt
    secrets:
      - maria_app1_migrator_password
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - app1-maria
    depends_on:
      maria-primary:
        condition: service_healthy

  laravel-api:
    build: ./apps/laravel-api
    image: security-prototype-phase1-laravel-api
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    # Runtime credential only (app1_runtime). No RUN_MIGRATIONS_ON_STARTUP.
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY_FILE: /run/secrets/laravel_app_key
      DB_CONNECTION: mariadb
      DB_HOST: maria-primary
      DB_PORT: "3306"
      DB_DATABASE: app1
      DB_USERNAME: app1_runtime
      DB_PASSWORD_FILE: /run/secrets/maria_app1_runtime_password
      MYSQL_ATTR_SSL_CA: /pki-ca/ca.crt
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
    secrets:
      - laravel_app_key
      - maria_app1_runtime_password
    volumes:
      - pki-ca:/pki-ca:ro
    networks:
      - web
      - app1-maria
    depends_on:
      laravel-migrate:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    image: security-prototype-phase1-web
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
    ports:
      # The only published port in phase 1. Still plain HTTP (TLS at the edge is a later phase).
      - "8080:80"
    networks:
      - edge
      - web
    depends_on:
      dotnet-api:
        condition: service_started
      laravel-api:
        condition: service_started

networks:
  # Not internal: the published port and outbound traffic of web go through here.
  edge:
    ipam:
      config:
        - subnet: 10.81.0.0/24
  # nginx to the two APIs.
  web:
    internal: true
    ipam:
      config:
        - subnet: 10.81.1.0/24
  # .NET side only: dotnet-api, dotnet-migrate, pg-primary.
  app1-pg:
    internal: true
    ipam:
      config:
        - subnet: 10.81.2.0/24
  # Laravel side only: laravel-api, laravel-migrate, maria-primary.
  app1-maria:
    internal: true
    ipam:
      config:
        - subnet: 10.81.3.0/24

volumes:
  pg-data:
  maria-data:
  pki-ca-key:
  pki-ca:
  pki-pg:
  pki-maria:

configs:
  pki_init:
    file: ./config/pki/pki-init.sh
  pg_init_roles:
    file: ./config/postgres/10-app1-roles.sh
  maria_init_users:
    file: ./config/mariadb/10-app1-users.sh
  # Replaces the image default (which ends in "host all all all scram-sha-256").
  # First match wins. The subnet is the app1-pg network above.
  pg_hba:
    content: |
      # TYPE  DATABASE  USER           ADDRESS        METHOD
      local   all       postgres                      peer
      hostssl app1      app1_runtime   10.81.2.0/24   scram-sha-256
      hostssl app1      app1_migrator  10.81.2.0/24   scram-sha-256
      host    all       all            all            reject

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password
  pg_app1_migrator_password:
    file: ./secrets/pg_app1_migrator_password
  pg_app1_runtime_password:
    file: ./secrets/pg_app1_runtime_password
  maria_root_password:
    file: ./secrets/maria_root_password
  maria_app1_migrator_password:
    file: ./secrets/maria_app1_migrator_password
  maria_app1_runtime_password:
    file: ./secrets/maria_app1_runtime_password
  laravel_app_key:
    file: ./secrets/laravel_app_key
  dotnet_app1_connstr:
    file: ./secrets/dotnet_app1_connstr
  dotnet_migrator_connstr:
    file: ./secrets/dotnet_migrator_connstr
